name: 更新净值数据

on:
  push:
    paths:
      - 'data/**'
    branches: [main]

  # 支持手动触发
  workflow_dispatch:

jobs:
  update-nav:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install xlrd akshare

      - name: 运行净值更新脚本
        run: python scripts/update_nav.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zhouqi/combined-data.json jiazhi/combined-data.json clients.json
          if git diff --cached --quiet; then
            echo "没有数据变更"
          else
            git commit -m "chore: 更新净值数据 $(date +%Y-%m-%d)"
            git push
          fi
